; Galaxy Frontier — DefaultInput.ini (Phase 01)
; Enhanced Input only. The Input Actions (IA_*) and Mapping Context
; (IMC_Player) are Blueprint assets created in the Unreal Editor — see
; Docs/INPUT.md for the exact creation steps. They are NOT faked here
; as .uasset binaries, and this .ini does not pretend to define them.
;
; This file records the intended default bindings so the Editor setup
; can be checked against a single source of truth.
;
; Action            Type        Default key / touch
; IA_Move           Vector2D    WASD / left virtual joystick
; IA_Look           Vector2D    Mouse / right-side touch drag
; IA_Jump           Bool        Space / HUD Jump button
; IA_Sprint         Bool        Left Shift (hold) / HUD Sprint button
; IA_Crouch         Bool        C (toggle) / HUD Crouch button
; IA_Aim            Bool        Right Mouse (hold) / HUD Aim button
; IA_Fire           Bool        Left Mouse (hold) / HUD Fire button
; IA_Reload         Bool        R / HUD Reload button
; IA_Interact       Bool        E / HUD Interact button
; IA_SwitchWeapon   Bool        Q / 1-2 / HUD Switch button
; IA_OpenInventory  Bool        Tab / I / HUD Inventory button
; IA_Pause          Bool        Esc / P / HUD Pause button
;
; Mapping Context: IMC_Player, priority 0, applied in
; AGFCharacter::BeginPlay via ULocalPlayer::GetSubsystem<UEnhancedInputLocalPlayerSubsystem>().
; Touch: DefaultViewportMouseCaptureMode / LockMode are set in
; DefaultEngine.ini. Multi-touch is required; see Docs/MOBILE-HUD.md.

[/Script/Engine.InputSettings]
bEnableLegacyInputSettings=False

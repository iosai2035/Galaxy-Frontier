; Galaxy Frontier — DefaultScalability.ini (Phase 00)
; Target: 30 fps minimum on older iPhones/iPads, 60 fps on capable
; devices. Do NOT claim 60 fps on all devices — measure per device
; (see Docs/DEVICE_TEST_MATRIX.md) and let DefaultDeviceProfiles.ini
; pick the group.

[ScalabilitySettings]
; Low — older / thermally limited devices.
[Low@3]
r.ViewDistanceScale=0.6
r.ShadowQuality=0
r.PostProcessAAQuality=0
r.TextureQuality=0
r.EffectsQuality=0
r.FoliageQuality=0

; Medium — default starting point for most iPhones/iPads.
[Medium@3]
r.ViewDistanceScale=0.8
r.ShadowQuality=1
r.PostProcessAAQuality=2
r.TextureQuality=1
r.EffectsQuality=1
r.FoliageQuality=1

; High — capable devices only, after measurement.
[High@3]
r.ViewDistanceScale=1.0
r.ShadowQuality=2
r.PostProcessAAQuality=3
r.TextureQuality=2
r.EffectsQuality=2
r.FoliageQuality=2

; Epic is intentionally NOT used on mobile in this project.

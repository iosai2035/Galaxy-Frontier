; Galaxy Frontier — DefaultScalability.ini (Phases 00-03, revised for
; the "realistic / high graphics" refinement)
; Target: 30 fps minimum on older iPhones/iPads, 60 fps on capable
; devices — per-device targets in Docs/DEVICE_TEST_MATRIX.md.
; Do NOT claim 60 fps on all devices. Measure per device and let
; DefaultDeviceProfiles.ini pick the group.
;
; Nanite / Lumen notes (honest, UE 5.5 on iOS):
; - Nanite: use for rocks / station hulls only where UE 5.5 on iOS
;   supports it in the Editor build; otherwise traditional LODs
;   (Docs/CHARACTERS.md) carry the visual quality. Nanite is NOT
;   assumed to be free on mobile.
; - Lumen: NOT used on iOS in this project. Lumen is desktop-first;
;   iOS uses baked lighting + one dynamic directional light.
;   Do not enable Lumen for the iOS build and expect it to work.
; - "Epic" quality is intentionally NOT used on mobile.

[ScalabilitySettings]
; Low — older / thermally limited devices. 30 fps target.
[Low@3]
r.ViewDistanceScale=0.6
r.ShadowQuality=0
r.PostProcessAAQuality=0
r.TextureQuality=0
r.EffectsQuality=0
r.FoliageQuality=0
r.MobileContentScaleFactor=0.8
sg.AntiAliasingQuality=0

; Medium — default starting point for most iPhones/iPads. 30 fps
; target, 60 fps only if measured on that device.
[Medium@3]
r.ViewDistanceScale=0.8
r.ShadowQuality=1
r.PostProcessAAQuality=2
r.TextureQuality=1
r.EffectsQuality=1
r.FoliageQuality=1
r.MobileContentScaleFactor=1.0
sg.AntiAliasingQuality=2

; High — capable devices only, AFTER measurement (Phase 04).
; 60 fps target on iPad Pro / iPhone Pro only if measured there.
; High still caps dynamic lights and shadows — see budgets in
; Docs/DEVICE_TEST_MATRIX.md (draw calls <= 150, polygons <= 500k,
; texture memory <= 512 MB, dynamic lights <= 2).
[High@3]
r.ViewDistanceScale=1.0
r.ShadowQuality=2
r.PostProcessAAQuality=3
r.TextureQuality=2
r.EffectsQuality=2
r.FoliageQuality=2
r.MobileContentScaleFactor=1.0
r.MobileMSAA=4
sg.AntiAliasingQuality=3
; Texture streaming pool is budgeted per device in
; DefaultDeviceProfiles.ini — do not raise it globally here.

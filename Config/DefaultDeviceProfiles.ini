; Galaxy Frontier — DefaultDeviceProfiles.ini (Phases 00-03, revised
; for the "realistic / high graphics" refinement)
; Device profiles pick a Scalability group per device. These are
; STARTING assignments; they must be revised from real FPS / RAM /
; thermal measurements (Docs/DEVICE_TEST_MATRIX.md). No device is
; marked as tested until it has actually been tested.
; No fixed 60 fps is claimed on any device — the targets below are
; to be measured in Phase 04.

[DeviceProfile]
; iPhone — default mobile profile.
[IOS DeviceProfile]
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileMSAA=2

; Older iPhone (e.g. iPhone 12/13 class) — Low, 30 fps target.
[iPhone DeviceProfile]
DeviceType=Iphone
BaseProfileName=IOS
+CVars=sg.ResolutionQuality=80
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=1
+CVars=r.Streaming.PoolSize=256

; iPhone Pro (current class) — High, 60 fps TARGET (to measure).
; Assigned High only as a starting point; if Phase 04 measurement
; shows < 60 fps / thermal throttling, this drops to Medium.
[iPhone Pro DeviceProfile]
DeviceType=Iphone
BaseProfileName=IOS
+CVars=sg.ResolutionQuality=100
+CVars=sg.ViewDistanceQuality=2
+CVars=sg.ShadowQuality=2
+CVars=sg.PostProcessQuality=2
+CVars=sg.TextureQuality=2
+CVars=sg.EffectsQuality=2
+CVars=r.MobileMSAA=4
+CVars=r.Streaming.PoolSize=512

; iPad base — Medium, 30 fps target.
[iPad DeviceProfile]
DeviceType=Ipad
BaseProfileName=IOS
+CVars=sg.ResolutionQuality=85
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=1
+CVars=r.Streaming.PoolSize=256
; iPads have larger screens: HUD Safe Area handling is mandatory
; (see Docs/MOBILE-HUD.md). Do not assume phone layouts fit iPad.

; iPad Pro (M-series class) — High, 60 fps TARGET (to measure).
; Same caveat as iPhone Pro: High is a starting assignment, not a
; measured result.
[iPad Pro DeviceProfile]
DeviceType=Ipad
BaseProfileName=IOS
+CVars=sg.ResolutionQuality=100
+CVars=sg.ViewDistanceQuality=2
+CVars=sg.ShadowQuality=2
+CVars=sg.PostProcessQuality=2
+CVars=sg.TextureQuality=2
+CVars=sg.EffectsQuality=2
+CVars=r.MobileMSAA=4
+CVars=r.Streaming.PoolSize=512

; Galaxy Frontier — DefaultDeviceProfiles.ini (Phase 00)
; Device profiles pick a Scalability group per device. These are
; starting assignments; they must be revised from real FPS / RAM /
; thermal measurements (Docs/DEVICE_TEST_MATRIX.md). No device is
; marked as tested until it has actually been tested.

[DeviceProfile]
; iPhone — default mobile profile.
[IOS DeviceProfile]
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileMSAA=2

[iPhone DeviceProfile]
DeviceType=Iphone
BaseProfileName=IOS
+CVars=sg.ResolutionQuality=80
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=1

[iPad DeviceProfile]
DeviceType=Ipad
BaseProfileName=IOS
+CVars=sg.ResolutionQuality=85
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=1
; iPads have larger screens: HUD Safe Area handling is mandatory
; (see Docs/MOBILE-HUD.md). Do not assume phone layouts fit iPad.

; Galaxy Frontier — DefaultGame.ini (Phases 00-06)

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=GalaxyFrontier

[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Shipping
FullRebuild=False
ForDistribution=False
bUsePakFile=True
bGenerateChunks=False
; iOS packaging is done on macOS with Xcode. This file only records intent;
; no IPA is produced on Linux.

[/Script/Engine.GameSession]
MaxPlayers=60
; Phase 06: 60 is the Battle Royale design target
; (Docs/BATTLE-ROYALE.md) — NOT a tested number. The two-player
; test comes first. Single-player games are unaffected: they run
; in Standalone mode and never create a session, so this value
; does not change single-player behaviour.
; The multiplayer GameMode is AGFGameMode (Source/GalaxyFrontier/
; Multiplayer). It is used only when a session starts a match
; level with it (see Docs/MULTIPLAYER.md); the project default
; GameMode for single-player levels is unchanged.
